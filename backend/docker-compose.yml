  version: '3.8'

  services:
    orbit-backend:
      build: .
      image: orbit_backend
      container_name: orbit_api
      ports:
        - "3000:3000" 
      volumes:
        - .:/usr/src/app
        - /usr/src/app/node_modules 
      environment:
        - PORT=3000
        - MONGO_URI=mongodb://mongodb:27017/twitter_dev
        - REDIS_HOST=redis
        - REDIS_PORT=6379
      depends_on:
        - mongodb
        - redis

    mongodb:
      image: mongo:6.0
      container_name: orbit_mongo
      restart: unless-stopped
      ports:
        - "27017:27017"
      volumes:
        - mongo_data:/data/db

    redis:
      image: redis:alpine
      container_name: orbit_redis
      restart: unless-stopped
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      command: redis-server --save 60 1 --loglevel warning

  volumes:
    mongo_data:
    redis_data: